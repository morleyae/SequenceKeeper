name: Build SequenceKeeper release

on:
  push:
    tags:
      - "sequencekeeper-v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#sequencekeeper-v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid SequenceKeeper release tag: $GITHUB_REF_NAME" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build package ZIP
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import shutil
          import zipfile
          from pathlib import Path

          version = os.environ["VERSION"]
          root = Path.cwd()
          staging = root / "dist" / "SequenceKeeper"
          archive = root / "dist" / f"SequenceKeeper-v{version}.zip"
          if staging.exists():
              shutil.rmtree(staging)
          staging.parent.mkdir(parents=True, exist_ok=True)
          shutil.copytree(root, staging, ignore=shutil.ignore_patterns(".git", ".github", "dist", ".DS_Store", "__pycache__", "*.pyc"))

          manifest_path = staging / "CSXS" / "manifest.xml"
          manifest = manifest_path.read_text(encoding="utf-8")
          manifest = re.sub(r'(ExtensionBundleVersion=")[^"]+(")', rf'\g<1>{version}\g<2>', manifest, count=1)
          manifest = re.sub(r'(<Extension Id="[^"]+" Version=")[^"]+(")', rf'\g<1>{version}\g<2>', manifest, count=1)
          manifest_path.write_text(manifest, encoding="utf-8")

          config_path = staging / "assets" / "js" / "update-config.js"
          config = {
              "currentVersion": version,
              "repository": "morleyae/SequenceKeeper",
              "development": False,
          }
          config_path.write_text("window.SequenceKeeperUpdateConfig = " + json.dumps(config) + ";\n", encoding="utf-8")

          if archive.exists():
              archive.unlink()
          with zipfile.ZipFile(archive, "w", zipfile.ZIP_DEFLATED) as bundle:
              for path in sorted(staging.rglob("*")):
                  if path.is_file():
                      bundle.write(path, Path("SequenceKeeper") / path.relative_to(staging))
          PY

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ steps.version.outputs.version }}"
          gh release create "$GITHUB_REF_NAME" \
            "dist/SequenceKeeper-v${version}.zip" \
            --repo "$GITHUB_REPOSITORY" \
            --title "SequenceKeeper ${version}" \
            --generate-notes